<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — S&M Panificadora</title>
  <style>
    :root {
      --fundo: #f6f1ea;
      --superficie: #fffdf9;
      --texto: #2b2118;
      --muted: #6d5c4d;
      --linha: #e6d9cc;
      --destaque: #8b5a2b;
      --erro: #9b2c2c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: var(--fundo);
      color: var(--texto);
    }

    main {
      width: min(100% - 2rem, 22rem);
      background: var(--superficie);
      border: 1px solid var(--linha);
      border-radius: 16px;
      padding: 1.75rem;
    }

    #logo-loja {
      display: block;
      max-height: 3.5rem;
      max-width: 100%;
      margin: 0 auto 0.75rem;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.35rem;
    }

    .login-slogan {
      margin: 0 0 1.25rem;
      color: var(--muted);
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 0.35rem;
    }

    input {
      width: 100%;
      margin-bottom: 0.9rem;
      padding: 0.6rem 0.7rem;
      border: 1px solid var(--linha);
      border-radius: 8px;
      font: inherit;
    }

    button[type="submit"] {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 0.7rem;
      background: var(--destaque);
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    button[type="submit"]:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #login-erro {
      min-height: 1.25rem;
      margin: 0 0 0.85rem;
      color: var(--erro);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <script>
    (function () {
      try {
        if (localStorage.getItem('sm.panificadora.token')) {
          window.location.replace('index.html');
        }
      } catch (erro) {
        /* sem storage, permanece no login */
      }
    })();
  </script>

  <main>
    <img id="logo-loja" alt="Logotipo da loja" hidden>
    <h1 id="nome-loja">S&amp;M Panificadora</h1>
    <p class="login-slogan">Entre com seu usuário para acessar o sistema.</p>
    <form id="form-login" method="post" action="#">
      <label for="username">Usuário</label>
      <input id="username" name="username" autocomplete="username" required>

      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>

      <p id="login-erro" role="alert"></p>
      <button type="submit">Entrar</button>
    </form>
  </main>

  <script type="module">
    import { obterUrlBaseDaApi } from './src/core/ambiente.js';
    import { definirApiBaseUrl } from './src/core/api.js';
    import { redirecionarSeAutenticado } from './src/modules/auth/guarda.js';
    import { iniciarFormularioLogin } from './src/modules/auth/login.js';
    import { aplicarIdentidadeVisual } from './src/modules/auth/identidade-visual.js';

    definirApiBaseUrl(obterUrlBaseDaApi());

    if (!redirecionarSeAutenticado()) {
      iniciarFormularioLogin(document.getElementById('form-login'));
      aplicarIdentidadeVisual({
        titulo: document.getElementById('nome-loja'),
        slogan: document.querySelector('.login-slogan'),
        logo: document.getElementById('logo-loja'),
      });
    }
  </script>
</body>
</html>
