<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — S&M Panificadora</title>
  <style>
    /* SPEC-FE-015 / PRD-016 — tokens alinhados ao shell (tema escuro clean) */
    :root {
      --fundo: #14171c;
      --superficie: #1b1f27;
      --superficie-elevada: #232833;
      --linha: #2e3440;
      --texto: #eef1f5;
      --muted: #8b93a3;
      --destaque: #e0913a;
      --destaque-escuro: #f2a94f;
      --perigo: #e5484d;
      --selecao: #5b9dd9;
      --raio: 14px;
      --sombra: 0 10px 32px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: radial-gradient(ellipse at center, #1f2430 0%, var(--fundo) 62%);
      color: var(--texto);
    }

    main {
      width: min(100% - 2rem, 22rem);
      background: var(--superficie);
      border: 1px solid var(--linha);
      border-radius: 20px;
      padding: 2rem 1.75rem 1.75rem;
      box-shadow: var(--sombra), 0 0 56px rgba(224, 145, 58, 0.08);
    }

    #logo-loja {
      display: block;
      height: 4.4rem;
      width: auto;
      max-width: 100%;
      margin: 0 auto 1.15rem;
    }

    #nome-loja {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .login-slogan {
      margin: 0 0 1.5rem;
      color: var(--muted);
      text-align: center;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    input {
      width: 100%;
      margin-bottom: 0.95rem;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--linha);
      border-radius: 10px;
      background: var(--superficie-elevada);
      color: var(--texto);
      font: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus {
      border-color: var(--selecao);
      box-shadow: 0 0 0 3px rgba(91, 157, 217, 0.2);
    }

    button[type="submit"] {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 0.8rem;
      background: linear-gradient(135deg, var(--destaque), var(--destaque-escuro));
      color: #1a1410;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    button[type="submit"]:hover { opacity: 0.92; }
    button[type="submit"]:active { transform: scale(0.98); }

    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #login-erro {
      min-height: 1.25rem;
      margin: 0 0 0.85rem;
      color: var(--perigo);
      font-size: 0.88rem;
      text-align: center;
    }

    @media (max-width: 560px) {
      body {
        min-height: 100dvh;
        padding: 1rem 0.75rem;
        align-items: start;
      }

      main {
        width: 100%;
        padding: 1.5rem 1rem 1.25rem;
      }

      input,
      button[type="submit"] {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <script>
    (function () {
      try {
        if (localStorage.getItem('sm.panificadora.token')) {
          window.location.replace('index.html');
        }
      } catch (erro) {
        /* sem storage, permanece no login */
      }
    })();
  </script>

  <main>
    <img id="logo-loja" src="assets/logo-horizontal-tela.svg" alt="S&amp;M Panificadora">
    <h1 id="nome-loja">S&amp;M Panificadora</h1>
    <p class="login-slogan">Entre com seu usuário para acessar o sistema.</p>
    <form id="form-login" method="post" action="#">
      <label for="username">Usuário</label>
      <input id="username" name="username" autocomplete="username" required>

      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>

      <p id="login-erro" role="alert"></p>
      <button type="submit">Entrar</button>
    </form>
  </main>

  <script type="module">
    import { obterUrlBaseDaApi } from './src/core/ambiente.js';
    import { definirApiBaseUrl } from './src/core/api.js';
    import { redirecionarSeAutenticado } from './src/modules/auth/guarda.js';
    import { iniciarFormularioLogin } from './src/modules/auth/login.js';
    import { aplicarIdentidadeVisual } from './src/modules/auth/identidade-visual.js';

    definirApiBaseUrl(obterUrlBaseDaApi());

    if (!redirecionarSeAutenticado()) {
      iniciarFormularioLogin(document.getElementById('form-login'));
      aplicarIdentidadeVisual({
        titulo: document.getElementById('nome-loja'),
        slogan: document.querySelector('.login-slogan'),
      });
    }
  </script>
</body>
</html>
